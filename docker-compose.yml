services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solano}
      POSTGRES_DB: ${POSTGRES_DB:-solano}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - solano_pgdata:/var/lib/postgresql/data

volumes:
  solano_pgdata:
